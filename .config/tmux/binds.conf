# Config reload
bind 'r' source-file "$XDG_CONFIG_HOME"/tmux/tmux.conf \; display "Source file reloaded"

# New window
bind 'c' new-window -c "#{pane_current_path}"
bind 'C' new-window

# Splitting
bind '\' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
bind '|' split-window -h
bind '_' split-window -v

# Closing
# bind -T x confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind -n 'C-x' kill-pane

# Movement between panes - smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n 'M-h' if-shell "$is_vim" 'send-keys M-h'  'select-pane -L'
bind -n 'M-j' if-shell "$is_vim" 'send-keys M-j'  'select-pane -D'
bind -n 'M-k' if-shell "$is_vim" 'send-keys M-k'  'select-pane -U'
bind -n 'M-l' if-shell "$is_vim" 'send-keys M-l'  'select-pane -R'

bind -T copy-mode-vi 'M-h' select-pane -L
bind -T copy-mode-vi 'M-j' select-pane -D
bind -T copy-mode-vi 'M-k' select-pane -U
bind -T copy-mode-vi 'M-l' select-pane -R

# Switch to previous pane
# tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
# if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
#     "bind-key -n 'M-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
# if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
#     "bind-key -n 'M-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"
# bind-key -T copy-mode-vi 'M-\' select-pane -l

# Movement between windows
bind -nr 'C-PageUp' select-window -t :-
bind -nr 'C-PageDown' select-window -t :+
bind -nr "C-S-PageUp" swap-window -dt -1
bind -nr "C-S-PageDown" swap-window -dt +1

# Movement between sessions
bind -r '(' switch-client -p
bind -r ')' switch-client -n

# Pane resizing (-r for repeatable)
bind -r 'h' resize-pane -L 5
bind -r 'j' resize-pane -D 5
bind -r 'k' resize-pane -U 5
bind -r 'l' resize-pane -R 5

# Copy and paste keys
bind 'Escape' copy-mode
bind -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
bind -T copy-mode-vi 'Enter' send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
bind -T copy-mode-vi 'MouseDragEnd1Pane' send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
unbind 'p'
bind 'p' paste-buffer
bind 'C-v' run "tmux set-buffer \"$(xclip -o -sel clipboard)\"; tmux paste-buffer"

# Synchronization
bind 'S' set-option synchronize-panes \; display "Synchronization #{?synchronize-panes,ON,OFF}"
